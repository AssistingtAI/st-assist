<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>报告额度追加申请 · 小调AI</title>
<style>
  :root{
    --green-900:#2F5A0E; --green-700:#3B6D11; --green-500:#639922;
    --green-300:#97C45B; --cream:#F5F8EF; --ink:#1F2A16; --muted:#6B7A5E;
    --line:#DDE7CF; --card:#FFFFFF;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    background:linear-gradient(170deg,#F5F8EF 0%,#EAF3DC 100%);color:var(--ink);
    min-height:100vh;padding:22px 16px 40px;
  }
  .wrap{max-width:520px;margin:0 auto}
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:16px}
  .logo{width:38px;height:38px;border-radius:12px;
    background:linear-gradient(140deg,var(--green-700),var(--green-300));
    display:flex;align-items:center;justify-content:center;font-size:19px}
  .brand h1{font-size:17px;margin:0;letter-spacing:.3px}
  .brand p{margin:2px 0 0;font-size:12px;color:var(--muted)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:18px 16px;margin-bottom:14px;box-shadow:0 2px 10px rgba(59,109,17,.05)}
  .card h2{font-size:15px;margin:0 0 12px;display:flex;align-items:center;gap:7px}
  .card h2::before{content:"";width:4px;height:15px;border-radius:2px;
    background:linear-gradient(var(--green-700),var(--green-300))}
  label{display:block;font-size:13px;margin:12px 0 6px;font-weight:600}
  label .opt{font-weight:400;color:var(--muted);font-size:12px}
  input,textarea,select{
    width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;
    font-size:14px;font-family:inherit;background:#FCFDF9;color:var(--ink);outline:none;
    transition:border-color .15s,box-shadow .15s;
  }
  input:focus,textarea:focus,select:focus{
    border-color:var(--green-500);box-shadow:0 0 0 3px rgba(99,153,34,.12)}
  textarea{resize:vertical;min-height:76px}
  .hint{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.55}
  .sponsor{display:flex;gap:10px;align-items:flex-start;margin-top:6px;
    background:linear-gradient(135deg,#F7FBF0,#EDF6E0);border:1px dashed var(--green-300);
    border-radius:12px;padding:12px}
  .sponsor input{width:18px;height:18px;flex:0 0 auto;margin-top:2px;accent-color:var(--green-700)}
  .sponsor div{font-size:13px;line-height:1.6}
  .sponsor b{color:var(--green-900)}
  button{
    width:100%;padding:14px;border:none;border-radius:12px;font-size:15px;font-weight:600;
    color:#fff;background:linear-gradient(135deg,var(--green-700),var(--green-500));
    margin-top:18px;cursor:pointer;letter-spacing:.5px;
    box-shadow:0 4px 14px rgba(59,109,17,.22);transition:transform .1s,opacity .2s;
  }
  button:active{transform:scale(.985)}
  button:disabled{opacity:.55;cursor:not-allowed}
  .result{display:none;text-align:center;padding:28px 16px}
  .result .icon{font-size:42px;margin-bottom:10px}
  .result h3{margin:0 0 8px;font-size:17px;color:var(--green-900)}
  .result p{margin:0;font-size:13.5px;color:var(--muted);line-height:1.7}
  .note{font-size:11.5px;color:var(--muted);line-height:1.7;text-align:center;margin-top:18px}
  .steps{display:flex;gap:6px;margin-bottom:4px}
  .step{flex:1;height:4px;border-radius:2px;background:var(--line)}
  .step.on{background:linear-gradient(90deg,var(--green-700),var(--green-300))}
</style>
</head>
<body>
<div class="wrap">

  <div class="brand">
    <div class="logo">🌿</div>
    <div>
      <h1>报告额度追加申请</h1>
      <p>小调AI · 上市公司公告数据整理</p>
    </div>
  </div>

  <div id="formArea">
    <div class="card">
      <h2>提交申请</h2>
      <div class="steps"><div class="step on"></div><div class="step"></div><div class="step"></div></div>
      <p class="hint" style="margin-top:10px">
        为让更多人用到，每人每月可自由生成 <b>3 篇</b> 新报告（已生成过的报告当月重复索取不计入）。
        如需追加，请填写下方信息，我们会尽快审核。
      </p>

      <label>联系方式 <span class="opt">（必填，方便我们回复你）</span></label>
      <input id="contact" placeholder="手机号 / 微信号" autocomplete="off">

      <label>所需标的 <span class="opt">（选填，多个用逗号分隔）</span></label>
      <input id="codes" placeholder="如 002795、600519" autocomplete="off">

      <label>申请说明 <span class="opt">（选填）</span></label>
      <textarea id="reason" placeholder="简要说明用途，如：课题研究需要批量查看同行业标的"></textarea>

      <div class="sponsor">
        <input type="checkbox" id="sponsor">
        <div>
          <b>我愿意赞助支持本项目</b>（完全自愿）<br>
          <span style="color:var(--muted)">赞助是对持续更新的鼓励，不作为额度审批的前提条件；表示感谢，我们会优先为你处理。</span>
        </div>
      </div>

      <button id="submitBtn">提交申请</button>
    </div>

    <p class="note">
      本服务仅整理公开公告数据、供研究参考，不构成投资建议。<br>
      申请信息仅用于本次审核与回复，不作他用。
    </p>
  </div>

  <div class="result card" id="resultArea">
    <div class="icon">✅</div>
    <h3>申请已提交</h3>
    <p id="resultMsg">我们会尽快审核，通过后即刻放开本月篇数。</p>
    <p style="margin-top:14px;font-size:12.5px">
      你也可以回到对话中直接发送股票代码，<br>额度放开后即可正常生成。
    </p>
  </div>

</div>

<script>
const LOCAL_KEY = "xt_apply_submitted";

document.getElementById("submitBtn").addEventListener("click", async () => {
  const contact = document.getElementById("contact").value.trim();
  const codes   = document.getElementById("codes").value.trim();
  const reason  = document.getElementById("reason").value.trim();
  const sponsor = document.getElementById("sponsor").checked;

  if (!contact) {
    alert("请填写联系方式，方便我们回复你。");
    document.getElementById("contact").focus();
    return;
  }

  const btn = document.getElementById("submitBtn");
  btn.disabled = true; btn.textContent = "提交中…";

  // 本地留存一份（便于离线/直连场景），并生成申请码给用户
  const reqId = "R" + Date.now().toString(36).toUpperCase().slice(-6);
  const payload = { id: reqId, contact, codes, reason, sponsor, ts: new Date().toISOString() };
  try {
    const list = JSON.parse(localStorage.getItem("xt_applies") || "[]");
    list.push(payload);
    localStorage.setItem("xt_applies", JSON.stringify(list));
  } catch (e) {}

  // 1) 优先走本地审批服务（仅当页面在本机打开时可达）；手机上 127.0.0.1 指向手机自身，
  //    且 HTTPS 页面请求 HTTP 会被浏览器拦截，故 1.2 秒超时快速降级，避免用户干等。
  const APPLY_API = localStorage.getItem("xt_apply_api") || "http://127.0.0.1:8899/apply";
  let ok = false;
  try {
    if (location.protocol !== "https:" || /^(127\.0\.0\.1|localhost)$/.test(location.hostname)) {
      const ctl = new AbortController();
      const timer = setTimeout(() => ctl.abort(), 1200);
      try {
        const resp = await fetch(APPLY_API, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ contact, codes, reason, sponsor }),
          signal: ctl.signal
        });
        const j = await resp.json();
        ok = !!j.ok;
      } finally { clearTimeout(timer); }
    }
  } catch (e) { ok = false; }

  // 兜底通道：邮件（服务不可达时仍能到达）
  if (!ok) {
    try {
      const resp2 = await fetch("https://formsubmit.co/ajax/zsheng007@qq.com", {
        method: "POST",
        headers: { "Content-Type": "application/json", "Accept": "application/json" },
        body: JSON.stringify({
          _subject: `【提额申请】${reqId} · ${contact}`,
          申请码: reqId, 联系方式: contact,
          所需标的: codes || "（未填）", 申请说明: reason || "（未填）",
          愿意赞助: sponsor ? "是" : "否",
          提交时间: new Date().toLocaleString("zh-CN"), 来源: "H5提额申请页"
        })
      });
      ok = resp2.ok;
    } catch (e) { ok = false; }
  }

  document.getElementById("formArea").style.display = "none";
  const r = document.getElementById("resultArea");
  r.style.display = "block";
  document.getElementById("resultMsg").innerHTML = ok
    ? `申请码 <b>${reqId}</b>，我们会尽快审核，通过后即刻放开本月篇数。`
    : `申请码 <b>${reqId}</b>（网络提交未成功，但已在本机留存，请把申请码发到对话中）`; 
});
</script>
</body>
</html>
